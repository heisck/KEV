# Render Blueprint — deploys the backend and the ML service from this one repo.
# Point Render at this file (New → Blueprint) and it creates/updates both services.
# Only non-secret values live here: everything marked `sync: false` is filled in from
# the Render dashboard, so no credential is ever committed. See docs/DEPLOYMENT.md.
#
# Frankfurt is the closest region to Ghana — keep Neon and Upstash in eu-central-1 too,
# or every query pays a transatlantic round trip.
services:
  # ── Face model (FastAPI + InsightFace) ─────────────────────────────────────
  # Only the backend calls this. The model is baked into the image at build time,
  # so a cold start does not download it.
  - type: web
    name: kev-ml
    runtime: docker
    repo: https://github.com/heisck/KEV
    branch: main
    region: frankfurt
    plan: starter # buffalo_sc + onnxruntime does not fit the 512MB free plan.
    dockerfilePath: ./ml/Dockerfile
    dockerContext: ./ml
    healthCheckPath: /health
    envVars:
      # Pinned so the backend's internal URL below stays valid — Render would
      # otherwise inject its own PORT and the address would move.
      - key: PORT
        value: '8000'
      - key: FACE_MODEL_NAME
        value: buffalo_sc
      - key: FACE_MATCH_THRESHOLD
        value: '0.35'
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: ML_SENTRY_DSN
        sync: false
      - key: HF_TOKEN
        sync: false

  # ── REST API (Spring Boot) ────────────────────────────────────────────────
  - type: web
    name: kev-backend
    runtime: docker
    repo: https://github.com/heisck/KEV
    branch: main
    region: frankfurt
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: '8080'
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Render's internal address for the ML service — private traffic, no public hop.
      # Confirm it against "Internal Address" on the kev-ml dashboard page.
      - key: ML_BASE_URL
        value: http://kev-ml:8000
      # `mock` (seeded UITS simulation) or `db`. Roster ingest uses UITS_BASE_URL
      # regardless — this only picks the student directory lookup source.
      - key: KEV_DIRECTORY_PROVIDER
        value: mock
      - key: UITS_BASE_URL
        value: https://kev-uits-rep.vercel.app
      - key: CACHE_TYPE
        value: redis
      - key: UPSTASH_REDIS_SSL
        value: 'true'
      - key: UPSTASH_REDIS_PORT
        value: '6379'
      - key: MANAGEMENT_HEALTH_REDIS
        value: 'true'
      - key: JWT_SECRET
        generateValue: true # 256-bit random, created once and kept across deploys.
      # ── Filled in from the dashboard (secrets / account-specific) ──
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: UPSTASH_REDIS_HOST
        sync: false
      - key: UPSTASH_REDIS_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: APPLE_CLIENT_IDS
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: SENTRY_DSN_BACKEND
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
      - key: ARKESEL_SENDER_ID
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_FROM_ADDRESS
        sync: false
      - key: GMAIL_FROM_NAME
        sync: false
      # First admin — set for the first boot, then blank them out and redeploy.
      - key: KEV_ADMIN_EMAIL
        sync: false
      - key: KEV_ADMIN_PASSWORD
        sync: false
      - key: KEV_ADMIN_NAME
        sync: false
